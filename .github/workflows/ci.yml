name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///ci.db
      # No OPENAI_API_KEY here on purpose: tests mock all AI calls.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Syntax and import check
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: No committed secrets
        run: "! grep -rEn 'sk-[A-Za-z0-9_-]{20,}' --include='*.py' --include='*.md' --include='*.toml' --include='*.yml' --include='.env*' ."
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Health check
        run: python health.py

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # report-only: advisories in transitive dependencies should not block unrelated work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt
