[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]        # syntax errors, undefined names, unused imports/variables

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["services", "database", "utils", "models", "config.py", "health.py"]
